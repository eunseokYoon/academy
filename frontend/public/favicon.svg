<!--
  남지원영어LAB. 로고의 NJ 모노그램을 남색 판에 얹었다.
  탭 아이콘은 16px로 줄어들어 워드마크가 안 읽히므로 마크만 쓴다.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <rect width="24" height="24" rx="5" fill="#1B2A44" />
  <g fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- N: 왼쪽 기둥에서 올라가 사선으로 내려온다. 오른쪽 기둥은 J가 맡는다 -->
    <path d="M7.4 17V7.4l8 8.6" stroke="#FFFFFF" />
    <!-- J: 기둥을 세우고 아래에서 왼쪽으로 갈고리를 건다 -->
    <path d="M16.6 7v8.4c0 1.7-1.4 2.9-3.1 2.5" stroke="#D9542B" />
  </g>
</svg>
