server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: /student 같은 클라이언트 라우트를 새로고침해도 index.html을 준다.
    # 이게 없으면 새로고침 시 404가 난다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 자산은 파일명에 해시가 붙으므로 길게 캐시한다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /api 프록시는 Phase 8에서 추가한다. 로컬은 백엔드를 직접 호출한다.
}
