spring:
  application:
    name: academy
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate      # 절대 update/create로 바꾸지 말 것
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: Asia/Seoul
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8080
  forward-headers-strategy: native
  error:
    # 에러 응답은 항상 ApiResponse.fail이다. /error로 새는 경로에서도 내부 정보를 내보내지 않는다.
    include-stacktrace: never
    include-message: never

# 파일이 아니라 표준출력으로 남긴다. 컨테이너 안 파일은 재시작하면 사라지고,
# Docker의 json-file 드라이버(compose의 logging 옵션)가 회전을 맡는다.
# logging.file.name을 넣지 마라.
logging:
  level:
    root: INFO
    com.njwenglish: INFO
    # DEBUG로 두면 t3.small 디스크가 빠르게 찬다.
    org.hibernate.SQL: WARN

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-validity-seconds: 1800        # 30분
    refresh-token-validity-seconds: 1209600    # 14일
    # 리프레시 쿠키의 Secure 플래그. 로컬(http)에서는 false여야 쿠키가 저장된다.
    # 운영에서는 REFRESH_COOKIE_SECURE=true로 반드시 켤 것.
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
  s3:
    bucket: ${S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
    presign-expiry-seconds: 300                # 5분 (업로드 PUT)
    read-expiry-seconds: 600                   # 10분 (조회 GET)
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
